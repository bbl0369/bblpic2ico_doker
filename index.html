<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Pic2Ico</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/static/app-icon.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #e5e7eb;
      --fg: #111827;
      --card-bg: #f9fafb;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-hover: #1d4ed8;
      --border: #cbd5e1;
      --border-soft: #e2e8f0;
      --muted: #6b7280;
    }
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #dbeafe 0, #e5e7eb 55%, #d1d5db 100%);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .shell {
      width: 100%;
      max-width: 960px;
      border-radius: 24px;
      background: rgba(248, 250, 252, 0.92);
      box-shadow:
        0 16px 45px rgba(15, 23, 42, 0.16),
        0 0 0 1px rgba(148, 163, 184, 0.45);
      padding: 20px 22px 22px;
      backdrop-filter: blur(18px);
    }
    .shell-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0.05em;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0f172a;
    }
    h1 span.logo-dot {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: conic-gradient(from 200deg, #22c55e, #14b8a6, #2563eb, #22c55e);
      box-shadow: 0 0 12px rgba(34, 197, 94, .65);
      display: inline-block;
      border: 1px solid rgba(22, 163, 74, .5);
    }
    .app-tagline {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid rgba(56, 189, 248, 0.55);
    }
    .subtitle {
      margin: 4px 0 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .card {
      background: linear-gradient(145deg, #f9fafb 0, #ffffff 38%, #e5e7eb 100%);
      border-radius: 18px;
      border: 1px solid rgba(203, 213, 225, .95);
      box-shadow:
        0 14px 34px rgba(15, 23, 42, 0.14);
      padding: 18px 18px 16px;
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    }
    @media (max-width: 800px) {
      .shell {
        padding: 16px 14px 18px;
        border-radius: 20px;
      }
      .card {
        grid-template-columns: minmax(0, 1fr);
        padding: 16px 12px 14px;
      }
      .shell-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #111827;
    }
    input[type="file"] {
      width: 100%;
      padding: 9px 10px;
      font-size: 13px;
      border-radius: 12px;
      border: 1px dashed #94a3b8;
      background: #f3f4f6;
      color: #111827;
      transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
    }
    input[type="file"]:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, .4);
      background: #e0f2fe;
    }
    input[type="file"]::file-selector-button {
      margin-right: 12px;
      padding: 6px 12px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(37, 99, 235, .18), rgba(37, 99, 235, .09));
      color: #1f2937;
      font-size: 12px;
      cursor: pointer;
      transition: filter .12s ease, transform .12s ease;
    }
    input[type="file"]::file-selector-button:hover {
      filter: brightness(1.05);
      transform: translateY(-0.5px);
    }
    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .size-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      background: #e5edff;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      transition: background .14s ease, border-color .14s ease, box-shadow .14s ease, transform .08s ease;
    }
    .size-pill input {
      accent-color: var(--accent);
    }
    .size-pill:hover {
      border-color: rgba(37, 99, 235, .75);
      box-shadow: 0 0 0 1px rgba(37, 99, 235, .22);
      background: #dbeafe;
      transform: translateY(-0.5px);
    }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .actions {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    button[type="submit"] {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 26px rgba(37, 99, 235, .32);
      transition: transform .12s ease, box-shadow .12s ease, filter .15s ease;
    }
    button[type="submit"]:hover {
      transform: translateY(-1.5px);
      filter: brightness(1.04);
      box-shadow: 0 16px 32px rgba(37, 99, 235, .38);
    }
    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(37, 99, 235, .28);
    }
    button[type="submit"]:disabled {
      opacity: .55;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    .btn-icon {
      font-size: 14px;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
    }
    .status strong {
      color: #111827;
    }
    .right {
      border-radius: 16px;
      border: 1px solid var(--border-soft);
      background: radial-gradient(circle at top, #dbeafe 0, #f3f4f6 70%);
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .preview-canvas {
      position: relative;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
      background:
        linear-gradient(45deg, #f3f4f6 25%, transparent 25%) 0 0 / 16px 16px,
        linear-gradient(-45deg, #f3f4f6 25%, transparent 25%) 0 0 / 16px 16px,
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%) 0 0 / 16px 16px,
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%) 0 0 / 16px 16px;
      padding: 12px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .preview-canvas::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(248, 250, 252, .7), transparent 55%);
      pointer-events: none;
    }
    .preview-canvas img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 14px 30px rgba(15, 23, 42, .22);
      position: relative;
      z-index: 1;
    }
    .preview-placeholder {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
    }
    .chip {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      background: #eef2ff;
      color: #3730a3;
    }
    .error {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(239, 68, 68, .32);
      background: #fef2f2;
      color: #b91c1c;
      font-size: 12px;
      display: none;
    }
    .success {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(22, 163, 74, .3);
      background: #ecfdf3;
      color: #15803d;
      font-size: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="shell-header">
      <h1>
        <!-- <img src="/static/app-icon.png" alt="Pic2Ico" style="width:20px;height:20px;border-radius:6px;box-shadow:0 4px 10px rgba(15,23,42,.35);object-fit:cover;"> -->
        Pic2Ico
        <span class="app-tagline">Docker Service</span>
      </h1>
    </div>
    <div class="subtitle">上传一张 PNG/JPG 图片，勾选需要的尺寸，生成多尺寸 ICO。</div>

    <div class="card">
      <div>
        <div class="section-title">SOURCE</div>
        <form id="convert-form">
          <label for="file">图片文件</label>
          <input type="file" id="file" name="file" accept="image/png,image/jpeg" required>

          <label style="margin-top:12px;">图标尺寸</label>
          <div class="sizes">
            <label class="size-pill"><input type="checkbox" name="sizes" value="256" checked> 256 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="128" checked> 128 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="96" checked> 96 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="64" checked> 64 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="48" checked> 48 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="32" checked> 32 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="24" checked> 24 px</label>
            <label class="size-pill"><input type="checkbox" name="sizes" value="16" checked> 16 px</label>
          </div>
          <div class="hint">至少勾选一个尺寸。生成的 ICO 会自动包含所有勾选的尺寸。</div>

          <div class="actions">
            <button type="submit" id="submit-btn">
              <span class="btn-icon">⬇</span>
              <span>生成 ICO 并下载</span>
            </button>
            <div class="status" id="status-text">等待上传图片…</div>
          </div>

          <div class="error" id="error-box"></div>
          <div class="success" id="success-box"></div>
        </form>
      </div>

      <div class="right">
        <div class="preview-header">
          <span>预览</span>
          <div class="chips">
            <span class="chip">支持 PNG / JPG</span>
            <span class="chip">多尺寸 ICO</span>
          </div>
        </div>
        <div class="preview-canvas" id="preview-area">
          <div class="preview-placeholder">选择一张图片后，这里会显示缩略图效果。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('convert-form');
    const fileInput = document.getElementById('file');
    const submitBtn = document.getElementById('submit-btn');
    const statusText = document.getElementById('status-text');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');
    const previewArea = document.getElementById('preview-area');

    function setStatus(text) {
      statusText.textContent = text;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      successBox.style.display = 'none';
    }

    function showSuccess(msg) {
      successBox.textContent = msg;
      successBox.style.display = 'block';
      errorBox.style.display = 'none';
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) {
        previewArea.innerHTML = '<div class="preview-placeholder">选择一张图片后，这里会显示缩略图效果。</div>';
        setStatus('等待上传图片…');
        return;
      }
      const url = URL.createObjectURL(file);
      previewArea.innerHTML = '<img src="' + url + '" alt="预览">';
      setStatus('已选择文件：' + file.name);
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const file = fileInput.files[0];
      if (!file) {
        showError('请先选择一张图片。');
        return;
      }

      const checkedSizes = Array.from(form.querySelectorAll('input[name="sizes"]:checked'));
      if (checkedSizes.length === 0) {
        showError('至少勾选一个图标尺寸。');
        return;
      }

      submitBtn.disabled = true;
      setStatus('正在生成 ICO…');
      showSuccess('');
      successBox.style.display = 'none';

      const formData = new FormData();
      formData.append('file', file);
      checkedSizes.forEach(cb => formData.append('sizes', cb.value));

      try {
        const resp = await fetch('/convert', {
          method: 'POST',
          body: formData
        });

        if (!resp.ok) {
          let msg = '转换失败（HTTP ' + resp.status + '）';
          try {
            const data = await resp.json();
            if (data && data.detail) msg = data.detail;
          } catch (_) {}
          showError(msg);
          setStatus('转换失败。');
        } else {
          const blob = await resp.blob();
          const dlUrl = URL.createObjectURL(blob);

          const a = document.createElement('a');
          const name = (file.name || 'icon').replace(/\.[^.]+$/, '');
          a.href = dlUrl;
          a.download = name + '.ico';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(dlUrl);

          showSuccess('转换成功，ICO 已下载。');
          setStatus('完成转换，可继续上传其他图片。');
        }
      } catch (err) {
        console.error(err);
        showError('网络或服务器异常，请稍后重试。');
        setStatus('转换失败。');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
